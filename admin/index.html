<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCKFUME Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f5f9;
      color: #191923;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 24px #0000000a;
    }

    h1 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #151522;
      color: white;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th, td {
      border: 1px solid #e5e5e5;
      padding: 12px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f0f0f5;
    }

    .hidden {
      display: none;
    }

    .note {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card" id="loginCard">
      <h1>POCKFUME Admin</h1>
      <p>Enter your admin API token to load orders.</p>

      <form id="loginForm">
        <input
          id="token"
          type="password"
          placeholder="Admin API token"
          autocomplete="current-password"
          required
        >

        <button type="submit">Open Dashboard</button>
      </form>

      <p id="status" role="status"></p>
      <p class="note">
        Your token is kept in this page's session only.
      </p>
    </section>

    <section class="card hidden" id="dashboard">
      <h1>POCKFUME Orders</h1>
      <button id="refreshButton">Refresh Orders</button>
      <button id="logoutButton">Log Out</button>

      <p id="orderStatus" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Address</th>
              <th>Product</th>
              <th>Quantity</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Delivery</th>
            </tr>
          </thead>

          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const tokenInput = document.getElementById("token");
    const status = document.getElementById("status");
    const orderStatus = document.getElementById("orderStatus");
    const ordersBody = document.getElementById("ordersBody");

    let adminToken = "";

    function cell(value) {
      const td = document.createElement("td");
      td.textContent =
        value === null || value === undefined || value === ""
          ? "—"
          : String(value);
      return td;
    }

    async function loadOrders() {
      orderStatus.textContent = "Loading orders...";
      ordersBody.replaceChildren();

      try {
        const response = await fetch("/api/admin/orders", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + adminToken
          },
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to load orders.");
        }

        const orders = Array.isArray(data.orders) ? data.orders : [];

        for (const order of orders) {
          const row = document.createElement("tr");

          const address = [
            order.address,
            order.city,
            order.state,
            order.pincode
          ].filter(Boolean).join(", ");

          [
            order.order_id,
            order.created_at,
            order.customer_name,
            order.customer_phone,
            order.customer_email,
            address,
            order.product,
            order.quantity,
            order.amount,
            order.payment_status,
            order.delivery_status
          ].forEach(value => row.appendChild(cell(value)));

          ordersBody.appendChild(row);
        }

        orderStatus.textContent =
          orders.length + " order(s) loaded.";
      } catch (error) {
        orderStatus.textContent = error.message;
      }
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      adminToken = tokenInput.value.trim();

      if (!adminToken) {
        status.textContent = "Enter your admin token.";
        return;
      }

      status.textContent = "Checking access...";

      try {
        const response = await fetch("/api/admin/orders", {
          headers: {
            "Authorization": "Bearer " + adminToken
          },
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Authentication failed.");
        }

        loginCard.classList.add("hidden");
        dashboard.classList.remove("hidden");

        const orders = Array.isArray(data.orders) ? data.orders : [];

        for (const order of orders) {
          const row = document.createElement("tr");

          const address = [
            order.address,
            order.city,
            order.state,
            order.pincode
          ].filter(Boolean).join(", ");

          [
            order.order_id,
            order.created_at,
            order.customer_name,
            order.customer_phone,
            order.customer_email,
            address,
            order.product,
            order.quantity,
            order.amount,
            order.payment_status,
            order.delivery_status
          ].forEach(value => row.appendChild(cell(value)));

          ordersBody.appendChild(row);
        }

        orderStatus.textContent = orders.length + " order(s) loaded.";
      } catch (error) {
        status.textContent = error.message;
        adminToken = "";
      }
    });

    document.getElementById("refreshButton").addEventListener(
      "click",
      loadOrders
    );

    document.getElementById("logoutButton").addEventListener(
      "click",
      () => {
        adminToken = "";
        tokenInput.value = "";
        ordersBody.replaceChildren();
        dashboard.classList.add("hidden");
        loginCard.classList.remove("hidden");
        status.textContent = "";
      }
    );
  </script>
</body>
</html>
