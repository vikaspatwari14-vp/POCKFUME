<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Status | POCKFUME</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f7f3ed;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px 25px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #171717;
      margin-bottom: 10px;
    }

    .icon {
      width: 75px;
      height: 75px;
      margin: 25px auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: #eee;
    }

    h1 {
      font-size: 25px;
      margin: 12px 0;
    }

    p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    .order {
      margin: 22px 0;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #171717;
      color: white;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .hidden {
      display: none !important;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    .success {
      background: #e3f5e8;
    }

    .pending {
      background: #fff0d4;
    }

    .error {
      background: #ffebeb;
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="brand">POCKFUME</div>
    <p>Small size. Lasting impression.</p>

    <div class="icon" id="statusIcon" aria-hidden="true">⏳</div>

    <h1 id="statusTitle">Checking your payment...</h1>

    <p id="statusMessage" aria-live="polite">
      Please wait while we confirm your payment securely.
    </p>

    <div class="order">
      <strong>Order ID:</strong>
      <div id="orderId">Loading...</div>
    </div>

    <button
      class="button hidden"
      id="retryButton"
      type="button">
      Check Payment Again
    </button>

    <a
      class="button hidden"
      id="homeButton"
      href="/">
      Return to POCKFUME
    </a>

    <a
      class="button secondary"
      id="whatsappButton"
      href="https://wa.me/919663712870"
      target="_blank"
      rel="noopener noreferrer">
      Contact Us on WhatsApp
    </a>

    <div class="note">
      Please keep your order ID for future reference.
    </div>
  </main>

  <script>
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order_id");

    const icon = document.getElementById("statusIcon");
    const title = document.getElementById("statusTitle");
    const message = document.getElementById("statusMessage");
    const orderElement = document.getElementById("orderId");
    const retryButton = document.getElementById("retryButton");
    const homeButton = document.getElementById("homeButton");

    let checking = false;
    let paymentConfirmed = false;
    let retryCount = 0;
    let retryTimer = null;

    const MAX_AUTO_RETRIES = 5;
    const RETRY_DELAY = 5000;

    orderElement.textContent = orderId || "Not available";

    function showStatus(symbol, heading, description, className) {
      icon.textContent = symbol;
      title.textContent = heading;
      message.textContent = description;

      icon.className = "icon";

      if (className) {
        icon.classList.add(className);
      }
    }

    function showHomeButton() {
      homeButton.classList.remove("hidden");
    }

    function stopAutomaticRetries() {
      if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
    }

    function scheduleRetry() {
      stopAutomaticRetries();

      if (
        paymentConfirmed ||
        retryCount >= MAX_AUTO_RETRIES
      ) {
        retryButton.classList.remove("hidden");
        retryButton.disabled = false;
        retryButton.textContent = "Check Payment Again";
        showHomeButton();
        return;
      }

      retryCount++;

      retryButton.classList.remove("hidden");
      retryButton.disabled = true;
      retryButton.textContent =
        "Checking again in " + (RETRY_DELAY / 1000) + " seconds...";

      retryTimer = setTimeout(() => {
        retryTimer = null;
        checkPayment(true);
      }, RETRY_DELAY);
    }

    async function checkPayment(isAutomatic = false) {
      if (checking || paymentConfirmed) {
        return;
      }

      if (!orderId) {
        stopAutomaticRetries();

        showStatus(
          "⚠️",
          "Order ID Missing",
          "We could not find your order ID. Please contact us for assistance.",
          "error"
        );

        retryButton.classList.add("hidden");
        showHomeButton();
        return;
      }

      checking = true;
      retryButton.disabled = true;
      retryButton.classList.remove("hidden");
      retryButton.textContent = "Verifying Payment...";

      if (!isAutomatic) {
        retryCount = 0;
      }

      showStatus(
        "⏳",
        "Checking Your Payment",
        "Please wait while we verify your order securely with Cashfree."
      );

      try {
        const response = await fetch(
          "/api/verify-order?order_id=" +
            encodeURIComponent(orderId),
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        let result;

        try {
          result = await response.json();
        } catch {
          throw new Error("Invalid verification response.");
        }

        if (!response.ok) {
          throw new Error(
            result.error ||
            result.message ||
            "Unable to verify payment."
          );
        }

        const status = String(
          result.orderStatus || ""
        ).toUpperCase();

        if (result.paid === true && status === "PAID") {
          paymentConfirmed = true;
          stopAutomaticRetries();

          showStatus(
            "✅",
            "Payment Successful!",
            "Thank you for shopping with POCKFUME. Your payment has been confirmed.",
            "success"
          );

          retryButton.classList.add("hidden");
          showHomeButton();
          homeButton.textContent = "Continue Shopping";
          return;
        }

        if (
          status === "EXPIRED" ||
          status === "TERMINATED"
        ) {
          stopAutomaticRetries();

          showStatus(
            "⚠️",
            "Payment Session Expired",
            "This payment session has expired. If money was deducted, please contact us before placing another order.",
            "error"
          );

          retryButton.classList.add("hidden");
          showHomeButton();
          return;
        }

        showStatus(
          "⌛",
          "Payment Not Confirmed Yet",
          "Your payment may still be processing. If money was deducted, please wait while we check again.",
          "pending"
        );

        scheduleRetry();

      } catch (error) {
        console.error("Payment verification error:", error);

        showStatus(
          "⚠️",
          "Unable to Confirm Payment",
          "We could not verify your payment right now. If money was deducted, please do not pay again immediately. Try checking again shortly.",
          "error"
        );

        scheduleRetry();

      } finally {
        checking = false;

        if (!paymentConfirmed && !retryTimer) {
          retryButton.disabled = false;
          retryButton.textContent = "Check Payment Again";
        }
      }
    }

    retryButton.addEventListener("click", () => {
      stopAutomaticRetries();
      retryCount = 0;
      checkPayment(false);
    });

    checkPayment();
  </script>

</body>
</html>
